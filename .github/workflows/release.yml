name: Release
on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Create tarball
        run: tar czf gitea-lugit-theme.tar.gz --directory=./dist .
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ./gitea-lugit-theme.tar.gz
